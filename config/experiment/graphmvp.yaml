# @package _global_
defaults:
  - _self_

hydra:
  # verbose: true
  sweeper:
    params:
      # Sweeps both families: graphmvp_gnn_* (GNN-*-sum baselines) and
      # graphmvp_{am,cp}_{max,mean,sum} (GraphMVP_* pretrained checkpoints).
      # The narrower glob(graphmvp_gnn_*) silently dropped the latter six.
      +model: glob(graphmvp_*)

