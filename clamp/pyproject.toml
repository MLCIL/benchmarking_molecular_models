    "nltk>=3.10.1",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "rdkit>=2023.9.6",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "swifter>=1.4.0",
